name: mindvault
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  sqflite: ^2.4.2
  path: ^1.9.1
  file_picker: ^10.3.2
  open_filex: ^4.7.0
  share_plus: ^11.1.0
  pdfrx: ^2.4.7
  path_provider: ^2.1.5
  ffmpeg_kit_flutter_new: ^4.5.1
  url_launcher: ^6.3.0
  archive: ^4.0.7
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  encrypt: ^5.0.3
  crypto: ^3.0.3
  pointycastle: ^3.7.4
  provider: ^6.1.5
  get_video_thumbnail: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/mindvault_icon.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/mindvault_icon.png"

  remove_alpha_ios: true